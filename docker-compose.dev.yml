# Development docker-compose file
# Use: docker-compose -f docker-compose.dev.yml up

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: relationship-graph-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: relationship_graph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./packages/backend/prisma:/prisma
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # For development, run backend and frontend locally with hot reload
  # Only postgres runs in Docker

volumes:
  postgres_data_dev:
    driver: local

networks:
  app-network:
    driver: bridge
